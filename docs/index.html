<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta name="author" content="HH2XX">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>EasyImage 文档</title>
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico" />
    <link href="//cdn.bootcdn.net/ajax/libs/docsify/4.13.0/themes/vue.min.css" rel="stylesheet">
</head>

<body>
    <div id="app">EasyImage 文档加载中...</div>

    <script>
        window.$docsify = {
            name: 'EasyImage | 文档',
            homepage: '../README.md',
            repo: 'https://github.com/HH2XX/EasyImages',
            loadSidebar: true,
            subMaxLevel: 1,
            loadNavbar: true,
            autoHeader: true,
            coverpage: true,
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md'
            },
            copyCode: {
                buttonText: '复制',
                errorText: '错误',
                successText: '复制成功'
            },
            count: {
                countable: true,
                fontsize: '0.9em',
                color: 'rgb(90,90,90)',
                language: 'chinese'
            },
            search: {
                maxAge: 86400000,
                paths: ['auto'],
                placeholder: '搜索文档'
            },
            plugins: [
                function (hook) {
                    var footer = [
                        '<hr/>',
                        '<footer>',
                        '<span>Copyright © Since 2018 HH2XX EasyImage. Docs by <a href="https://docsify.js.org/#/zh-cn/" target="_blank" rel="noopener">Docsify</a>.</span>',
                        '</footer>'
                    ].join('');

                    hook.afterEach(function (html) {
                        return html + footer;
                    });
                },
                function (hook) {
                    hook.beforeEach(function (html) {
                        var url = '../README.md';
                        var editHtml = '<a href="' + url + '" target="_blank">查看项目说明</a>';
                        return html + '<br/><br/><br/><br/><br/>' + editHtml;
                    });
                }
            ]
        };

        if (typeof navigator.serviceWorker !== 'undefined') {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <script src="//cdn.bootcdn.net/ajax/libs/docsify/4.13.0/docsify.min.js"></script>
    <script src="//cdn.bootcdn.net/ajax/libs/docsify/4.13.0/plugins/search.min.js"></script>
    <script src="//cdn.bootcdn.net/ajax/libs/docsify/4.13.0/plugins/zoom-image.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/docsify-copy-code"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.bootcdn.net/ajax/libs/docsify/4.13.0/plugins/external-script.min.js"></script>
    <script src="//unpkg.com/docsify-count/dist/countable.js"></script>
    <script src="//fastly.jsdelivr.net/gh/Sumsung524/docsify-backTop/dist/docsify-backTop.min.js"></script>
</body>

</html>
